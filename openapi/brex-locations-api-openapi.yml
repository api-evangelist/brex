openapi: 3.2.0
info:
  title: Team Locations API
  description: The team API lets you manage users, departments, locations, and cards.
  contact:
    name: Admin
    url: https://brex.com
    email: developer-support@brex.com
  version: '1.0'
  x-logo:
    altText: Brex Logo
    url: https://www.brex.com/logo.png
servers:
- url: https://api.brex.com
  description: Production
- url: https://api-staging.brex.com
  description: 'Staging (Note: This is not a sandbox. It will not work with customer tokens.)'
security:
- OAuth2: []
tags:
- name: Locations
  description: Endpoints for location management.
paths:
  /v2/locations:
    get:
      tags:
      - Locations
      summary: List locations
      description: This endpoint lists all locations.
      operationId: listLocations
      parameters:
      - name: cursor
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: query
        schema:
          type:
          - integer
          - 'null'
          format: int32
      - name: name
        in: query
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: listLocations 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_LocationResponse_'
      security:
      - OAuth2:
        - locations.readonly
      - OAuth2:
        - locations
    post:
      tags:
      - Locations
      summary: Create location
      description: This endpoint creates a new location.
      operationId: createLocation
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
        required: true
      responses:
        '200':
          description: createLocation 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
      security:
      - OAuth2:
        - locations
  /v2/locations/{id}:
    get:
      tags:
      - Locations
      summary: Get location
      description: This endpoint gets a location by ID.
      operationId: getLocationById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: getLocationById 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
      security:
      - OAuth2:
        - locations.readonly
      - OAuth2:
        - locations
    put:
      tags:
      - Locations
      summary: Update location
      description: This endpoint updates a location by ID. Only the fields present in the request body are changed.
      operationId: updateLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        schema:
          type:
          - string
          - 'null'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
        required: true
      responses:
        '200':
          description: updateLocation 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
      security:
      - OAuth2:
        - locations
    delete:
      tags:
      - Locations
      summary: Delete location
      description: This endpoint deletes a location by ID. A location cannot be deleted while users are still assigned to it or while it is used as a filter on an active group.
      operationId: deleteLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: deleteLocation 200 response
      security:
      - OAuth2:
        - locations
components:
  schemas:
    UpdateLocationRequest:
      type: object
      properties:
        name:
          minLength: 1
          type:
          - string
          - 'null'
          description: Name of the location. Cannot be blank when supplied.
        description:
          type:
          - string
          - 'null'
          description: Description of the location. Pass null or an empty string to clear it.
    Page_LocationResponse_:
      required:
      - items
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationResponse'
    LocationResponse:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the location
        description:
          type:
          - string
          - 'null'
          description: Description of the location
    CreateLocationRequest:
      required:
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Name of the location
        description:
          type:
          - string
          - 'null'
          description: Description of the location
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 security scheme
      flows:
        authorizationCode:
          authorizationUrl: https://accounts-api.brex.com/oauth2/default/v1/authorize
          tokenUrl: https://accounts-api.brex.com/oauth2/default/v1/token
          scopes:
            openid: openid
            offline_access: offline access
            users.readonly: View user data
            users: View and manage user data
            locations.readonly: View location data
            locations: View and manage location data
            departments.readonly: View department data
            departments: View and manage department data
            titles: View and manage title data
            titles.readonly: View title data
            cost_centers: View and manage cost center data
            cost_centers.readonly: View cost center data
            cards: View and manage card data
            cards.readonly: View card data
            cards.pan: View and Send card number data
            legal_entities: View and manage legal entities
            legal_entities.readonly: View legal entities
x-explorer-enabled: false
x-provenance:
  method: harvested
  publisher: Brex
  source: https://developer.brex.com/_bundle/openapi/team_api.yaml?download
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
