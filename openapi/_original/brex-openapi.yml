  /v2/users:
    get:
      tags:
        - Users
      summary: |

        List users
      description: >

        This endpoint lists all users.


        Results can be narrowed with the filter query parameters below. Values
        within a single

        filter are OR-ed, and separate filters are AND-ed together.


        Filters that accept multiple values take them either as a
        comma-separated list or as a repeated

        parameter: `?status[]=ACTIVE,INVITED` and
        `?status[]=ACTIVE&status[]=INVITED` are equivalent.


        The legacy singular `email` and `remote_display_id` parameters perform
        an exact lookup that returns

        at most one user, and cannot be combined with the filters above.
      operationId: listUsers
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            nullable: true
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            nullable: true
        - name: email
          in: query
          schema:
            type: string
            description: >-
              Currently only support filtering by a single email or a single
              remote_display_id.
            nullable: true
        - name: remote_display_id
          in: query
          schema:
            type: string
            description: >-
              Currently only support filtering by a single email or a single
              remote_display_id.
            nullable: true
        - name: name
          in: query
          description: >-
            Fuzzy, case-insensitive match against the user's first name, last
            name and email.
          schema:
            type: string
            nullable: true
        - name: email[]
          in: query
          description: >-
            Filter by email address. Accepts several emails, e.g.
            `?email[]=a@example.com,b@example.com`.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: status[]
          in: query
          description: >-
            Filter by user status. Accepts several statuses, e.g.
            `?status[]=ACTIVE,INVITED`. By default, deleted and archived users
            are excluded.
          schema:
            type: array
            nullable: true
            items:
              type: string
              enum:
                - INVITED
                - ACTIVE
                - DISABLED
                - PENDING_ACTIVATION
                - INACTIVE
                - ARCHIVED
        - name: manager_id[]
          in: query
          description: Filter by the user_id of the manager. Accepts a list of managers.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: department_id[]
          in: query
          description: Filter by department_id. Accepts a list of departments.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: location_id[]
          in: query
          description: Filter by location_id. Accepts a list of locations.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: title_id[]
          in: query
          description: Filter by title_id. Accepts a list of titles.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: cost_center_id[]
          in: query
          description: Filter by cost_center_id. Accepts a list of cost centers.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: legal_entity_id[]
          in: query
          description: Filter by legal_entity_id. Accepts a list of legal entities.
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: load_custom_fields
          in: query
          description: Load custom field values for the users.
          schema:
            type: boolean
            nullable: true
        - name: custom_field[]
          in: query
          description: >-
            Filter by custom field value, given as `key:option_id`. Accepts a
            list of custom fields. Values within a single key are OR-ed, and
            separate keys are AND-ed together.
          schema:
            type: array
            nullable: true
            items:
              type: string
      responses:
        '200':
          description: listUsers 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_UserResponse_'
      security:
        - OAuth2:
            - users.readonly
        - OAuth2:
            - users
    post:
      tags:
        - Users
      summary: |

        Invite user
      description: >

        This endpoint invites a new user as an employee.

        To update user's role, check out [this
        article](https://support.brex.com/how-do-i-change-another-user-s-role/).
      operationId: createUser
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '200':
          description: createUser 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - OAuth2:
            - users
  /v2/users/create:
    post:
      tags:
        - Users
      summary: |

        Create user
      description: >

        This endpoint creates a new user as an employee without inviting them,
        leaving the user `INACTIVE`.

        Use it to load your team into Brex ahead of time; invite them later with

        [Invite user](#tag/Users/operation/createUser), on the Dashboard, or by
        using auto-invite rules.


        The user is assigned to `legal_entity_id` when provided, and to your
        account's default legal entity otherwise.
      operationId: addUser
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRequest'
        required: true
      responses:
        '200':
          description: addUser 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - OAuth2:
            - users
  /v2/users/me:
    get:
      tags:
        - Users
      summary: |

        Get current user
      description: |

        This endpoint returns the user associated with the OAuth2 access token.
      operationId: getMe
      parameters:
        - name: load_custom_fields
          in: query
          description: Load custom field values for the users.
          schema:
            type: boolean
            nullable: true
      responses:
        '200':
          description: getMe 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - OAuth2:
            - users.readonly
        - OAuth2:
            - users
  /v2/users/{id}:
    get:
      tags:
        - Users
      summary: |

        Get user
      description: |

        This endpoint gets a user by ID.
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: load_custom_fields
          in: query
          description: Load custom field values for the users.
          schema:
            type: boolean
            nullable: true
      responses:
        '200':
          description: getUserById 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - OAuth2:
            - users.readonly
        - OAuth2:
            - users
    put:
      tags:
        - Users
      summary: |

        Update user
      description: >

        This endpoint updates a user. Any parameters not provided will be left
        unchanged.
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            nullable: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: updateUser 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - OAuth2:
            - users
components:
  schemas:
    AccountType:
      type: string
      enum:
        - BREX_CLASSIC
        - BREX_EMPOWER
    AddUserRequest:
      required:
        - email
        - first_name
        - last_name
      type: object
      properties:
        first_name:
          minLength: 1
          type: string
        last_name:
          minLength: 1
          type: string
        email:
          type: string
          format: email
        manager_id:
          type: string
          nullable: true
        department_id:
          type: string
          nullable: true
        location_id:
          type: string
          nullable: true
        title_id:
          type: string
          nullable: true
        cost_center_id:
          type: string
          nullable: true
        legal_entity_id:
          type: string
          description: >-
            The legal entity to assign the user to. Defaults to the account's
            default legal entity.
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            The metadata or customized attributes of the user. Maximum number of
            entries: 100
          nullable: true
    Address:
      type: object
      properties:
        line1:
          type: string
          description: Address line 1, no PO Box.
          nullable: true
        line2:
          type: string
          description: Address line 2 (e.g., apartment, suite, unit, or building).
          nullable: true
        city:
          type: string
          description: City, district, suburb, town, or village.
          nullable: true
        state:
          type: string
          description: >-
            For US-addressed the 2-letter State abbreviation. For
            international-addresses the county, providence, or region.
          nullable: true
        country:
          type: string
          description: Two-letter country code (ISO 3166-1 alpha-2).
          nullable: true
        postal_code:
          type: string
          description: ZIP or postal code.
          nullable: true
        phone_number:
          type: string
          description: Phone number.
          nullable: true
      description: >-
        Company business address (must be in the US; no PO box or
        virtual/forwarding addresses allowed).
    BooleanListValue:
      title: Boolean list value
      required:
        - data_type
      type: object
      properties:
        data:
          type: array
          nullable: true
          items:
            type: boolean
            description: The data of the custom field.
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - BOOLEAN
      description: Boolean list value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.MultipleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    BooleanValue:
      title: Boolean value
      required:
        - data_type
      type: object
      properties:
        data:
          type: boolean
          description: The data of the custom field.
          nullable: true
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - BOOLEAN
      description: Boolean value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.SingleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    Card:
      required:
        - billing_address
        - created_at
        - expiration_date
        - id
        - last_four
        - limit_type
        - owner
      type: object
      properties:
        id:
          type: string
        owner:
          $ref: '#/components/schemas/CardOwner'
        status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CardStatus'
        last_four:
          type: string
        card_name:
          type: string
          nullable: true
        card_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CardType'
        limit_type:
          $ref: '#/components/schemas/LimitType'
        spend_controls:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpendControl'
        billing_address:
          $ref: '#/components/schemas/Address'
        mailing_address:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Address'
        expiration_date:
          $ref: '#/components/schemas/CardExpiration'
        has_been_transferred:
          type: boolean
          description: >

            Indicates whether a card has been transferred. Transferred cards
            have a spending restriction: we only allow transactions \

            at online vendors where this card was previously used before the
            transfer.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >

            Set of key value pairs associated with this object. Please do not
            store any personally identifiable or sensitive information here.

            Limitations: maximum of 50 keys, keys cannot exceed 40 characters,
            values cannot exceed 500 characters. 
          nullable: true
        budget_id:
          type: string
          nullable: true
        partner:
          type: string
          description: |

            The partner that manages this card, if any.
          nullable: true
        created_at:
          type: string
          description: The timestamp when the card was created
          example: '2019-08-24T14:15:22Z'
      description: |

        Only cards with limit_type = CARD have spend_controls
    CardAttributePreferences:
      type: object
      properties:
        three_domain_secure_enabled_preference:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ThreeDomainSecureEnabledPreference'
    CardExpiration:
      required:
        - month
        - year
      type: object
      properties:
        month:
          type: integer
          format: int32
        year:
          type: integer
          format: int32
      description: >

        Card expiration year and month. Cards expire on the last day of the
        expiration month.


        The expiration date is in UTC for cards starting with 555671, 428803 and
        485932.

        And the expiration date is in PST for cards starting with 511572.
    CardNumberResponse:
      required:
        - cvv
        - expiration_date
        - holder_name
        - id
        - number
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        cvv:
          type: string
        expiration_date:
          $ref: '#/components/schemas/CardExpiration'
        holder_name:
          type: string
      description: |

        Card number, CVV, and expiration date of a card.
    CardOwner:
      type: object
      discriminator:
        propertyName: type
        mapping:
          USER: '#/components/schemas/UserOwner'
      oneOf:
        - $ref: '#/components/schemas/UserOwner'
    CardStatus:
      type: string
      enum:
        - ACTIVE
        - SHIPPED
        - LOCKED
        - TERMINATED
    CardType:
      type: string
      enum:
        - VIRTUAL
        - PHYSICAL
    ChangeCardReason:
      type: string
      description: |

        Reason for card termination.
      enum:
        - CARD_DAMAGED
        - CARD_LOST
        - CARD_NOT_RECEIVED
        - DO_NOT_NEED_PHYSICAL_CARD
        - DO_NOT_NEED_VIRTUAL_CARD
        - FRAUD
        - OTHER
    CompanyResponse:
      required:
        - accountType
        - id
        - legal_name
        - mailing_address
      type: object
      properties:
        id:
          type: string
        legal_name:
          type: string
        mailing_address:
          $ref: '#/components/schemas/Address'
        accountType:
          $ref: '#/components/schemas/AccountType'
    CostCenterResponse:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the cost center
    CreateCardRequest:
      required:
        - card_name
        - card_type
        - limit_type
        - owner
      type: object
      properties:
        owner:
          $ref: '#/components/schemas/CardOwner'
        card_name:
          minLength: 1
          type: string
        card_type:
          $ref: '#/components/schemas/CardType'
        limit_type:
          $ref: '#/components/schemas/LimitType'
        spend_controls:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpendControlRequest'
        mailing_address:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Address'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >

            Set of key value pairs associated with this object. Please do not
            store any personally identifiable or sensitive information here.

            Limitations: maximum of 50 keys, keys cannot exceed 40 characters,
            values cannot exceed 500 characters. 
          nullable: true
        card_attribute_preferences:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CardAttributePreferences'
      description: >

        The `spend_controls` field is required when `limit_type` = `CARD`.

        The `shipping_address` field is required for physical cards, and the
        first 2 lines of the address must be under 60 characters long.
    CreateDepartmentRequest:
      required:
        - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Name of the department
        description:
          type: string
          description: Description of the department
          nullable: true
    CreateLocationRequest:
      required:
        - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Name of the location
        description:
          type: string
          description: Description of the location
          nullable: true
    CreateTitleRequest:
      required:
        - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Name of the title
    CreateUserRequest:
      required:
        - email
        - first_name
        - last_name
      type: object
      properties:
        first_name:
          minLength: 1
          type: string
        last_name:
          minLength: 1
          type: string
        email:
          type: string
          format: email
        manager_id:
          type: string
          nullable: true
        department_id:
          type: string
          nullable: true
        location_id:
          type: string
          nullable: true
        title_id:
          type: string
          nullable: true
        cost_center_id:
          type: string
          nullable: true
        legal_entity_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties:
            type: string
          description: >-
            The metadata or customized attributes of the user. Maximum number of
            entries: 100
          nullable: true
    CustomField:
      required:
        - key
        - value
      type: object
      properties:
        key:
          type: string
          description: The key of the custom field.
        value:
          allOf:
            - $ref: '#/components/schemas/CustomField.ValueWrapper'
            - description: The value of the custom field.
              oneOf:
                - $ref: '#/components/schemas/StringValue'
                - $ref: '#/components/schemas/DecimalValue'
                - $ref: '#/components/schemas/BooleanValue'
                - $ref: '#/components/schemas/EnumValue'
                - $ref: '#/components/schemas/TimestampValue'
                - $ref: '#/components/schemas/DateValue'
                - $ref: '#/components/schemas/MoneyValue'
                - $ref: '#/components/schemas/OptionStringValue'
                - $ref: '#/components/schemas/StringListValue'
                - $ref: '#/components/schemas/DecimalListValue'
                - $ref: '#/components/schemas/BooleanListValue'
                - $ref: '#/components/schemas/EnumListValue'
                - $ref: '#/components/schemas/TimestampListValue'
                - $ref: '#/components/schemas/DateListValue'
                - $ref: '#/components/schemas/MoneyListValue'
                - $ref: '#/components/schemas/OptionStringListValue'
    CustomField.ValueWrapper:
      required:
        - data_type
        - value_type
      type: object
      properties:
        value_type:
          allOf:
            - $ref: '#/components/schemas/CustomFieldValueType'
            - description: The type of the custom field value.
        data_type:
          allOf:
            - $ref: '#/components/schemas/CustomFieldDataType'
            - description: The type of the custom field data.
      description: Base class for custom field values
    CustomField.ValueWrapper.MultipleValueWrapper:
      required:
        - value_type
      type: object
      properties:
        value_type:
          allOf:
            - $ref: '#/components/schemas/CustomFieldValueType'
            - description: The type of the custom field value.
      description: Multiple value wrapper for custom fields
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    CustomField.ValueWrapper.SingleValueWrapper:
      required:
        - value_type
      type: object
      properties:
        value_type:
          allOf:
            - $ref: '#/components/schemas/CustomFieldValueType'
            - description: The type of the custom field value.
      description: Single value wrapper for custom fields
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    CustomFieldDataType:
      required:
        - 'true'
      type: string
      description: The type of the custom field data.
      enum:
        - STRING
        - DECIMAL
        - BOOLEAN
        - ENUM
        - TIMESTAMP
        - DATE
        - MONEY
        - OPTION_STRING
    CustomFieldValueType:
      required:
        - 'true'
      type: string
      description: The type of the custom field value.
      enum:
        - SINGLE_VALUE
        - LIST
    DateListValue:
      title: Date list value
      required:
        - data_type
      type: object
      properties:
        data:
          type: array
          nullable: true
          items:
            type: string
            description: The data of the custom field.
            format: date
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - DATE
      description: Date list value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.MultipleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    DateValue:
      title: Date value
      required:
        - data_type
      type: object
      properties:
        data:
          type: string
          description: The data of the custom field.
          format: date
          nullable: true
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - DATE
      description: Date value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.SingleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    DecimalListValue:
      title: Decimal list value
      required:
        - data_type
      type: object
      properties:
        data:
          type: array
          nullable: true
          items:
            type: number
            description: The data of the custom field.
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - DECIMAL
      description: Decimal list value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.MultipleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    DecimalValue:
      title: Decimal value
      required:
        - data_type
      type: object
      properties:
        data:
          type: number
          description: The data of the custom field.
          nullable: true
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - DECIMAL
      description: Decimal value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.SingleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    DepartmentResponse:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the department
        description:
          type: string
          description: Description of the department
          nullable: true
    EnumListValue:
      title: Enum list value
      required:
        - data_type
      type: object
      properties:
        data:
          type: array
          nullable: true
          items:
            type: string
            description: The data of the custom field.
            format: enum
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - ENUM
      description: Enum list value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.MultipleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    EnumValue:
      title: Enum value
      required:
        - data_type
      type: object
      properties:
        data:
          type: string
          description: The data of the custom field.
          format: enum
          nullable: true
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - ENUM
      description: Enum value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.SingleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    LegalEntity:
      title: |

        Legal Entity
      required:
        - billingAddress
        - createdAt
        - displayName
        - id
        - status
      type: object
      properties:
        id:
          type: string
          description: |

            The ID of this legal entity.
        displayName:
          type: string
          description: |

            The display name of this legal entity.
        billingAddress:
          allOf:
            - $ref: '#/components/schemas/Address'
            - description: >

                The billing address of this legal entity. Also used as billing
                address for cards issued to users who belong to this entity.
        createdAt:
          type: string
          description: |

            Timestamp, in UTC, when this legal entity was created.
          format: date-time
        status:
          allOf:
            - $ref: '#/components/schemas/LegalEntityStatus'
            - description: |

                The current status of this legal entity.
        isDefault:
          type: boolean
          description: |

            Whether this is the default entity of the account.
      description: |

        A Brex legal entity.
    LegalEntityStatus:
      type: string
      description: |

        The possible statuses for an entity's verification in Brex.
      enum:
        - UNSUBMITTED
        - UNVERIFIED
        - IN_PROGRESS
        - VERIFIED
        - REJECTED
    LimitType:
      type: string
      description: >

        `limit_type = CARD` for vendor cards. Vendor cards must have a
        `card_type` of `VIRTUAL` 

        and do not rely on the user specific limit. 


        For corporate cards, `limit_type = USER`.


        Learn more about different card types
        [here](https://support.brex.com/what-are-the-different-types-of-cards-i-can-get/).
      enum:
        - CARD
        - USER
    LocationResponse:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Name of the location
        description:
          type: string
          description: Description of the location
          nullable: true
    LockCardRequest:
      required:
        - reason
      type: object
      properties:
        description:
          type: string
          description: Description for locking a card
          nullable: true
        reason:
          $ref: '#/components/schemas/ChangeCardReason'
      description: Parameters for locking a card.
    LockedMerchantDetails:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: The name of the merchant.
          example: Github
      description: |

        Merchant details used for restricting or blocking transactions.
    Money:
      required:
        - amount
      type: object
      properties:
        amount:
          type: integer
          description: >-
            The amount of money, in the smallest denomination of the currency
            indicated by currency. For example, when currency is USD, amount is
            in cents.
          format: int64
          example: 700
        currency:
          type: string
          description: The type of currency, in ISO 4217 format.
          nullable: true
          example: USD
          default: USD
      description: >

        Money fields can be signed or unsigned. Fields are signed (an unsigned
        value will be interpreted as positive). The amount of money will be
        represented in the smallest denomination

        of the currency indicated. For example, USD 7.00 will be represented in
        cents with an amount of 700.
    MoneyListValue:
      title: Money list value
      required:
        - data_type
      type: object
      properties:
        data:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Money'
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - MONEY
      description: Money list value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.MultipleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    MoneyValue:
      title: Money value
      required:
        - data_type
      type: object
      properties:
        data:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: The data of the custom field.
        data_type:
          type: string
          description: The type of the custom field data.
          enum:
            - MONEY
      description: Money value for a custom field
      allOf:
        - $ref: '#/components/schemas/CustomField.ValueWrapper.SingleValueWrapper'
        - $ref: '#/components/schemas/CustomField.ValueWrapper'
    OptionString:
      type: object
      properties:
        option_id:
          type: string
          description: The identifier when custom field data is of type option string.
          nullable: true
        option_label:
          type: string
