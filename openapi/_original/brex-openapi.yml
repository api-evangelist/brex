    UpdateUserStatus:
      type: string
      description: >

        Acceptable user status for update. The value you send is the status the
        user ends up in. Only transitions

        that are legal for the user's current status are accepted; anything else
        is rejected with a 400.


        ```
          ACTIVE   <-->  DISABLED     suspend an active user / unsuspend a suspended one
          INACTIVE <-->  ARCHIVED     archive an inactive user / restore an archived one

          INVITED   -->  DELETED      withdraw an invitation and delete user
          INACTIVE  -->  DELETED      delete an inactive user
        ```
      enum:
        - ACTIVE
        - DISABLED
        - ARCHIVED
        - INACTIVE
        - DELETED
